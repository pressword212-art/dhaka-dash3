<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dhaka Dash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&display=swap">
<style>
:root{--bg:#2a1b3d;--ink:#fff0d2;--accent:#ff5a3c;--panel:rgba(32,20,48,.86);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1029;--panel:rgba(22,13,34,.88)}}
:root[data-theme="dark"]{--bg:#1a1029;--panel:rgba(22,13,34,.88)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.f{font-family:"Rubik Mono One",Impact,"Arial Black",sans-serif}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;padding:14px 18px;pointer-events:none;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#hud small{display:block;font-family:system-ui,sans-serif;font-size:13px;opacity:.9;margin-top:2px}
#msg{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 72px);text-align:center;font-size:17px;font-weight:700;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6);pointer-events:none}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
#card{background:var(--panel);border:2px solid var(--ink);border-radius:18px;padding:26px 28px;max-width:400px;text-align:center}
#card h1{margin:0 0 10px;font-size:34px;line-height:1.1;font-weight:400}
#card p{margin:0 0 18px;line-height:1.5;font-size:15px}
button{font:inherit;cursor:pointer}
#go{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:13px 24px;font-size:16px}
#go:focus-visible,.pad:focus-visible,#mu:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#mu{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--panel);color:var(--ink);font-size:20px}
#pads{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);display:none;justify-content:space-between;padding:16px}
.grp{display:flex;gap:10px}
.pad{width:19vw;max-width:110px;height:84px;border-radius:16px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);font-size:17px}
@media (pointer:coarse){#pads{display:flex}}
</style>
</head>
<body>
<div id="hud" class="f"><div><span id="sc">0</span> m<small>distance</small></div><div style="text-align:right"><span id="sp">0</span> km/h<small id="tm">06:00</small></div></div>
<div id="msg"></div>
<button id="mu" aria-label="Toggle sound" aria-pressed="true">♪</button>
<div id="pads"><div class="grp"><button class="pad" id="bl" aria-label="Steer left">◀</button><button class="pad" id="br" aria-label="Steer right">▶</button></div><div class="grp"><button class="pad" id="bk">Brake</button><button class="pad" id="bu">Gas</button></div></div>
<div id="ov"><div id="card"><h1 class="f" id="t">Dhaka Dash</h1><p id="m">Steer with the arrow keys or A and D. Gas is W or Up, brake is S, Down or Space, and H honks. Stop at red lights while pedestrians cross, and hit nothing. On a phone, use the on-screen buttons.</p><button id="go">Start driving</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xffb08a);
scene.fog=new THREE.Fog(0xe0a58c,40,210);
const cam=new THREE.PerspectiveCamera(65,1,.1,420);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(ren.domElement);
function rs(){ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
const hemi=new THREE.HemisphereLight(0xffffff,0x2a1a40,1);scene.add(hemi);
const dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(-5,10,5);scene.add(dl);
const mk=(g,c,b)=>new THREE.Mesh(g,b?new THREE.MeshBasicMaterial({color:c}):new THREE.MeshLambertMaterial({color:c}));
const box=(w,h,d,c,b)=>mk(new THREE.BoxGeometry(w,h,d),c,b);
const put=(p,m,x,y,z)=>{m.position.set(x,y,z);p.add(m);return m};
// time of day: dawn, noon, dusk, night
const SKY=[0xffb08a,0x7ec8f0,0xf08a5d,0x0a0f2e],FOG=[0xe0a58c,0xb5dcf0,0x8a4f72,0x0c1030],GR=[0x5f8f4a,0x4f9a43,0x4a6a3f,0x14281c],SUNC=[0xffc98a,0xfff6d0,0xff8a45,0xfff6d0];
const LI=[.8,1.2,.8,.3],NI=[.35,0,.45,1],c2=new THREE.Color();
function cyc(a,p,o){const x=p*4,i=Math.floor(x)%4;o.set(a[i]);c2.set(a[(i+1)%4]);return o.lerp(c2,x%1)}
function cycn(a,p){const x=p*4,i=Math.floor(x)%4;return a[i]+(a[(i+1)%4]-a[i])*(x%1)}
const sun=new THREE.Mesh(new THREE.SphereGeometry(30,32,16),new THREE.MeshBasicMaterial({color:0xffe3a8,fog:false}));sun.position.set(0,24,-280);scene.add(sun);
const moon=new THREE.Mesh(new THREE.SphereGeometry(12,24,12),new THREE.MeshBasicMaterial({color:0xe8eeff,fog:false}));moon.position.set(60,0,-270);scene.add(moon);
const sa=[];for(let i=0;i<220;i++)sa.push((Math.random()-.5)*360,15+Math.random()*140,-290);
const sgm=new THREE.BufferGeometry();sgm.setAttribute('position',new THREE.Float32BufferAttribute(sa,3));
const stars=new THREE.Points(sgm,new THREE.PointsMaterial({color:0xffffff,size:2,sizeAttenuation:false,fog:false,transparent:true,opacity:0}));scene.add(stars);
// ground, road, sidewalks
const grass=box(500,.1,640,0x4f9a43);grass.position.set(0,-.1,-250);scene.add(grass);
const road=box(13,.1,640,0x2b2b36);road.position.set(0,0,-250);scene.add(road);
[-7.9,7.9].forEach(x=>{const s=box(2.6,.25,640,0x8a8a92);s.position.set(x,.1,-250);scene.add(s)});
[-6.3,6.3].forEach(x=>{const e=box(.25,.12,640,0xfff0d2,1);e.position.set(x,.03,-250);scene.add(e)});
const dashes=new THREE.Group();
[-2.17,2.17].forEach(x=>{for(let i=0;i<32;i++)put(dashes,box(.22,.12,4,0xfff0d2,1),x,.03,-i*10)});
scene.add(dashes);
const sc=[],scn=(o,w)=>{scene.add(o);sc.push([o,w]);return o};
// buildings with windows (lit at night)
const FC=['#b9a58f','#8f9fb0','#a56e5e','#cbc4b6'],ft=[],lt=[],bm=[];
function tex(col,lit){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  x.fillStyle=lit?'#000':col;x.fillRect(0,0,128,128);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){x.fillStyle=lit?(Math.random()<.55?'#ffd27a':'#000'):'#1d2636';x.fillRect(8+i*30,8+j*30,18,20)}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
FC.forEach(c=>{ft.push(tex(c,0));lt.push(tex(c,1))});
for(let i=0;i<44;i++){const s=i%2?1:-1,w=6+Math.random()*5,h=8+Math.random()*30,d=8+Math.random()*6,k=i%4;
  const a=ft[k].clone(),b=lt[k].clone();a.needsUpdate=b.needsUpdate=true;a.repeat.set(w/8,h/8);b.repeat.set(w/8,h/8);
  const m=new THREE.MeshLambertMaterial({map:a,emissive:0xffffff,emissiveMap:b,emissiveIntensity:0});bm.push(m);
  const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  o.position.set(s*(13+w/2+Math.random()*2),h/2,-(i>>1)*16-Math.random()*6);scn(o,352)}
// trees and street lamps
const trM=new THREE.MeshLambertMaterial({color:0x5a3a24}),crM=new THREE.MeshLambertMaterial({color:0x2f7a3a});
const tg=new THREE.CylinderGeometry(.18,.26,2.2,6),cg=new THREE.IcosahedronGeometry(1.6,0);
for(let i=0;i<52;i++){const g=new THREE.Group(),s=i%2?1:-1;
  put(g,new THREE.Mesh(tg,trM),0,1.1,0);put(g,new THREE.Mesh(cg,crM),0,3.4,0).scale.y=1.2;
  g.position.set(s*(10.6+Math.random()*1.2),0,-(i>>1)*12-Math.random()*5);scn(g,312)}
const lampM=new THREE.MeshBasicMaterial({color:0x777777}),pg=new THREE.CylinderGeometry(.07,.1,6.5,6),bg0=new THREE.SphereGeometry(.3,8,6);
for(let i=0;i<16;i++){const g=new THREE.Group(),s=i%2?1:-1;
  put(g,mk(pg,0x444450),0,3.25,0);put(g,new THREE.Mesh(bg0,lampM),-s*.9,6.5,0);put(g,box(.9,.08,.08,0x444450),-s*.45,6.5,0);
  g.position.set(s*8.9,0,-(i>>1)*40-10);scn(g,320)}
// cars
const tailM=new THREE.MeshBasicMaterial({color:0x701010});
function racer(c){const g=new THREE.Group(),k=0x15151c;g.userData.w=[];
  put(g,box(1,.42,3.2,c),0,.5,.2);
  put(g,mk(new THREE.CylinderGeometry(.1,.42,1.9,12),c),0,.42,-2.3).rotation.x=-Math.PI/2;
  [-1,1].forEach(s=>{put(g,box(.55,.38,1.7,c),s*.78,.45,.3);put(g,box(.06,.3,.6,c),s*1.15,.3,-3.2);put(g,box(.06,.5,.7,c),s*.95,1,1.75)});
  put(g,box(.22,.02,3.1,0xf2f2f2),0,.72,.2);
  put(g,mk(new THREE.SphereGeometry(.22,10,8),0xffd23f),0,.88,.35);
  put(g,box(.45,.5,.8,c),0,.98,1);
  put(g,box(2.3,.07,.55,k),0,.16,-3.2);put(g,box(1.9,.08,.6,k),0,1.2,1.75);put(g,box(.12,.6,.12,k),0,.85,1.7);
  put(g,new THREE.Mesh(new THREE.BoxGeometry(.5,.16,.06),tailM),0,.8,1.84);
  [[-1.15,-1.6,.36,.45],[1.15,-1.6,.36,.45],[-1.15,1.5,.42,.65],[1.15,1.5,.42,.65]].forEach(([x,z,r,wd])=>{
    const gm=new THREE.CylinderGeometry(r,r,wd,16);gm.rotateZ(Math.PI/2);
    const wh=put(g,mk(gm,0x111116),x,r,z);wh.userData.r=r;
    put(wh,box(.02,r*1.5,.1,0xcccccc),Math.sign(x)*(wd/2+.01),0,0);g.userData.w.push(wh)});
  return g}
function car(c){const g=new THREE.Group();put(g,box(2,.7,4,c),0,.65,0);put(g,box(1.6,.6,2,0x1c1c28),0,1.3,-.2);
  [[-1.05,1.3],[1.05,1.3],[-1.05,-1.3],[1.05,-1.3]].forEach(([x,z])=>put(g,box(.35,.7,.8,0x111),x,.35,z));
  [-.65,.65].forEach(x=>put(g,box(.5,.2,.1,0xff2a2a,1),x,.75,2.02));return g}
const player=racer(0xd7263d);scene.add(player);
const spot=new THREE.SpotLight(0xfff0cc,0,70,.5,.6);spot.position.set(0,.9,-2.5);spot.target.position.set(0,0,-30);player.add(spot,spot.target);
const cols=[0x3fa7d6,0xf2c14e,0x59c3a5,0xe8e8f0,0x9b6ee0,0xd1495b],LANES=[-4.3,0,4.3],traffic=[];
function respawn(c,z){c.position.set(LANES[Math.random()*3|0],0,z);c.userData.s=12+Math.random()*10;c.children[0].material.color.setHex(cols[Math.random()*cols.length|0])}
for(let i=0;i<7;i++){const c=car(cols[i%6]);respawn(c,-70-i*38);scene.add(c);traffic.push(c)}
// crosswalks with traffic lights and pedestrians
let gt=0;const CYC=15,LC=[[0xff2a2a,0x3a1010],[0xffc61a,0x3a3010],[0x3dff7a,0x103a1a]],cws=[];
const cwState=w=>{const t=(gt+w.off)%CYC;return t<7?0:t<9?1:2};
function mkCW(z){const g=new THREE.Group(),w={g,z,off:Math.random()*CYC,peds:[]};
  for(let i=0;i<8;i++)put(g,box(.9,.04,3,0xf0f0f0),-5.5+i*1.57,.07,0);
  put(g,box(13,.04,.35,0xf0f0f0),0,.07,2.6);
  const L=LC.map(c=>new THREE.MeshBasicMaterial({color:c[1]}));w.L=L;
  [-1,1].forEach(s=>{const h=new THREE.Group();put(h,mk(new THREE.CylinderGeometry(.08,.1,5,6),0x333333),0,2.5,0);put(h,box(.6,1.7,.45,0x202028),0,5.3,0);
    L.forEach((m,i)=>put(h,new THREE.Mesh(new THREE.SphereGeometry(.2,8,6),m),0,5.85-i*.55,.25));h.position.set(s*7.4,0,-2.4);g.add(h)});
  for(let i=0;i<5;i++){const p=new THREE.Group(),sd=i%2?1:-1,dz=-1.2+i*.6;
    put(p,box(.4,.85,.28,[0xd1495b,0x3fa7d6,0xf2c14e,0x59c3a5,0x9b6ee0][i]),0,1.03,0);put(p,box(.34,.6,.22,0x2a2a3a),0,.3,0);put(p,mk(new THREE.SphereGeometry(.2,8,6),0xd9a679),0,1.65,0);
    p.position.set(sd*7.6,.08,dz);g.add(p);w.peds.push({m:p,x:sd*7.6,t:-sd*7.6,dz,rest:false})}
  scene.add(g);cws.push(w)}
mkCW(-220);mkCW(-520);
// audio: synth music, engine, tyres, crashes
let AC,mg,sg,mt,nb,on=true,nt=0,st=0,eo1,eo2,ef,eg,bf,bgn,lastV=0;
const CH=[[45,[57,60,64,69]],[41,[53,57,60,65]],[48,[55,60,64,67]],[43,[55,59,62,67]]];
const fq=m=>440*Math.pow(2,(m-69)/12);
function tone(t,m,d,ty,vol,cut,o){const os=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
  os.type=ty;os.frequency.value=fq(m);f.type='lowpass';f.frequency.value=cut;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);
  os.connect(f);f.connect(g);g.connect(o||mg);os.start(t);os.stop(t+d+.05)}
function kick(t,o){const os=AC.createOscillator(),g=AC.createGain();
  os.frequency.setValueAtTime(150,t);os.frequency.exponentialRampToValueAtTime(40,t+.12);
  g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);os.connect(g);g.connect(o||mg);os.start(t);os.stop(t+.22)}
function noise(t,d,vol,hp,ty,o){const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
  s.buffer=nb;f.type=ty||'highpass';f.frequency.value=hp;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(o||mg);s.start(t);s.stop(t+d)}
function beat(t){const c=CH[(st>>4)&3],s=st&15;
  if(s===0)c[1].forEach(n=>tone(t,n-12,1.9,'triangle',.06,900));
  if(s%4===0)kick(t);
  if(s===4||s===12)noise(t,.15,.25,1800);
  if(s%4===2)noise(t,.04,.12,7000);
  if(s%2===0)tone(t,c[0],.22,'sawtooth',.22,500);
  tone(t,c[1][s&3]+(s&4?12:0),.18,'square',.05,2400)}
function audioInit(){
  if(!AC){const AX=window.AudioContext||window.webkitAudioContext;if(!AX)return;
    AC=new AX();mt=AC.createGain();mt.gain.value=on?1:0;mt.connect(AC.destination);
    mg=AC.createGain();mg.gain.value=.45;mg.connect(mt);sg=AC.createGain();sg.gain.value=.8;sg.connect(mt);
    nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    eo1=AC.createOscillator();eo1.type='sawtooth';eo2=AC.createOscillator();eo2.type='square';
    ef=AC.createBiquadFilter();ef.type='lowpass';eg=AC.createGain();eg.gain.value=0;
    eo1.connect(ef);eo2.connect(ef);ef.connect(eg);eg.connect(sg);eo1.start();eo2.start();
    const bs=AC.createBufferSource();bs.buffer=nb;bs.loop=true;bf=AC.createBiquadFilter();bf.type='bandpass';bf.Q.value=4;
    bgn=AC.createGain();bgn.gain.value=0;bs.connect(bf);bf.connect(bgn);bgn.connect(sg);bs.start();
    nt=AC.currentTime+.1;setInterval(()=>{while(nt<AC.currentTime+.25){beat(nt);nt+=60/118/4;st++}},50)}
  if(AC.state==='suspended')AC.resume()}
function sfx(th,br){if(!AC)return;const t=AC.currentTime,run=state==='run',gear=Math.min(5,v/18|0),r=(v-gear*18)/18,f=42+gear*9+r*60+th*8;
  eo1.frequency.setTargetAtTime(f,t,.05);eo2.frequency.setTargetAtTime(f*.5,t,.05);ef.frequency.setTargetAtTime(260+r*700+th*500,t,.05);
  eg.gain.setTargetAtTime(run?.07+th*.08:0,t,.08);
  bf.frequency.setTargetAtTime(1500+v*10,t,.05);bgn.gain.setTargetAtTime(run&&br&&v>10?Math.min(.16,v/450):0,t,.05);
  if(run&&lastV>6&&v<.5)noise(t,.3,.18,300,'lowpass',sg);
  lastV=v}
function boom(){if(AC){const t=AC.currentTime;noise(t,.8,.9,500,'lowpass',sg);kick(t,sg);noise(t+.03,.3,.4,3000,'highpass',sg)}}
function honk(){if(AC){const t=AC.currentTime;tone(t,60,.5,'square',.25,1400,sg);tone(t,64,.5,'square',.25,1400,sg)}}
$('mu').addEventListener('click',()=>{on=!on;if(mt)mt.gain.value=on?1:0;$('mu').style.opacity=on?1:.45;$('mu').setAttribute('aria-pressed',on)});
document.addEventListener('visibilitychange',()=>{if(AC){if(document.hidden)AC.suspend();else AC.resume()}});
// game state and input
let state='ready',v=22,dist=0,px=0,steer=0,shake=0,off=0,best=0;
try{best=+localStorage.getItem('dd-best')||0}catch(e){}
const keys={l:0,r:0,u:0,b:0},KM={arrowleft:'l',a:'l',arrowright:'r',d:'r',arrowup:'u',w:'u',arrowdown:'b',s:'b',' ':'b'};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(KM[k]){keys[KM[k]]=1;e.preventDefault()}
  if(k==='h')honk();
  if((k===' '||k==='enter')&&state!=='run')start()});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(KM[k])keys[KM[k]]=0});
[['bl','l'],['br','r'],['bu','u'],['bk','b']].forEach(([id,k])=>{const el=$(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>keys[k]=0))});
function start(){audioInit();state='run';v=25;dist=0;px=0;steer=0;shake=0;lastV=0;player.rotation.set(0,0,0);
  traffic.forEach((c,i)=>respawn(c,-70-i*38));cws[0].z=-220;cws[1].z=-520;$('ov').style.display='none'}
$('go').addEventListener('click',start);
function crash(why){if(state!=='run')return;state='over';shake=.7;boom();const d=Math.floor(dist);
  if(d>best){best=d;try{localStorage.setItem('dd-best',d)}catch(e){}}
  $('t').textContent='Crashed';$('m').textContent=why+' Distance: '+d+' m. Best: '+best+' m.';
  $('go').textContent='Drive again';$('ov').style.display='flex'}
const clock=new THREE.Clock();
function tick(){requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05);gt+=dt;const th=keys.u,br=keys.b;
  if(state==='run'){
    const ac=br?-65:th?26*(1-v/115):-(3+v*.03);v=Math.max(0,Math.min(110,v+ac*dt));dist+=v*dt;
    steer+=((keys.r-keys.l)-steer)*Math.min(1,dt*8);
    px=Math.max(-5.2,Math.min(5.2,px+steer*dt*(4+Math.min(v,60)*.25)));
  }else if(state==='over'){v=Math.max(0,v-70*dt);player.rotation.y+=v>1?7*dt:0}
  else{v=22;steer=0}
  player.position.x=px;
  if(state==='run'){player.rotation.y=-steer*.2;player.rotation.z=-steer*.05}
  player.userData.w.forEach(w=>w.rotation.x-=v*dt/w.userData.r);
  tailM.color.setHex(br&&state==='run'?0xff3030:0x701010);
  // day and night
  const p=(.08+gt/160)%1,n=cycn(NI,p);
  cyc(SKY,p,scene.background);cyc(FOG,p,scene.fog.color);cyc(GR,p,grass.material.color);
  hemi.intensity=cycn(LI,p);dl.intensity=hemi.intensity*.55;hemi.color.copy(scene.background);
  const sy=55*Math.sin(p*6.283);sun.position.y=sy+8;moon.position.y=-sy+8;cyc(SUNC,p,sun.material.color);
  stars.material.opacity=n*n;bm.forEach(m=>m.emissiveIntensity=n);
  lampM.color.setHex(n>.35?0xffe9a8:0x777777);spot.intensity=n>.3?n*2.5:0;
  const h=(p*24+6)%24;$('tm').textContent=String(h|0).padStart(2,'0')+':'+String((h%1)*60|0).padStart(2,'0');
  // world scroll
  off=(off+v*dt)%10;dashes.position.z=off;
  sc.forEach(([o,w])=>{o.position.z+=v*dt;if(o.position.z>24)o.position.z-=w});
  let msg='';
  cws.forEach(w=>{w.z+=v*dt;if(w.z>25)w.z-=600;w.g.position.z=w.z;
    const s=cwState(w),red=s===2;
    w.L.forEach((m,i)=>m.color.setHex(LC[i][(i===0?s===2:i===1?s===1:s===0)?0:1]));
    if(state==='run'&&s!==0&&w.z<-8&&w.z>-120&&v>20)msg=red?'Red light ahead. Brake!':'Light is changing. Slow down.';
    w.peds.forEach(q=>{if(!red)q.rest=false;const dx=q.t-q.x;
      if(Math.abs(dx)<.1){q.x=q.t;q.t=-q.t;q.rest=true}
      else if(Math.abs(q.x)<7.2||(red&&!q.rest))q.x+=Math.sign(dx)*3.2*dt;
      q.m.position.x=q.x;q.m.rotation.y=dx>0?-1.57:1.57;
      const z=w.z+q.dz;if(state==='run'&&Math.abs(q.x)<7.2&&z>-3.6&&z<2.4&&Math.abs(q.x-px)<1.6)crash('You hit a pedestrian.')})});
  $('msg').textContent=msg;
  // traffic obeys the lights
  traffic.forEach(c=>{let s=c.userData.s;
    cws.forEach(w=>{if(cwState(w)!==0){const g=c.position.z-(w.z+4.5);if(g>-1&&g<16)s*=Math.max(0,g)/16}});
    c.position.z+=(v-s)*dt;
    if(c.position.z>16||c.position.z<-340)respawn(c,-230-Math.random()*60);
    if(state==='run'&&Math.abs(c.position.x-px)<2.2&&c.position.z>-5.3&&c.position.z<3.8)crash('You hit a car.')});
  shake*=Math.pow(.02,dt);
  cam.fov=65+(v-30)*.12;cam.updateProjectionMatrix();
  cam.position.set(px*.5+(Math.random()-.5)*shake,4.4+(Math.random()-.5)*shake,10);cam.lookAt(px*.4,1,-12);
  $('sc').textContent=Math.floor(dist);$('sp').textContent=Math.round(v*3);
  sfx(th,br);ren.render(scene,cam)}
tick();
